# School V2 — PowerSchool V4 cards (Trent + Teagan)
#
# Resource (module):
#   https://cdn.jsdelivr.net/gh/cjprsnin/powerschool-ha@main/www/powerschool-v4-card.js
# or after HACS update:
#   /hacsfiles/powerschool-ha/powerschool-v4-card.js
#   (exact path depends on how HACS serves www/)
#
# Card options:
#   student: required (Trent | Teagan)
#   show_empty: true — keep courses with no grade yet (useful for Teagan)
#   sort: grade — optional, highest % first

title: School V2
views:
  - title: School
    path: school
    icon: mdi:school
    type: sections
    max_columns: 2
    sections:
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Trent
            heading_style: title
            icon: mdi:account-school
          - type: custom:powerschool-v4-card
            student: Trent
            grid_options:
              columns: full

      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Teagan
            heading_style: title
            icon: mdi:account-school-outline
          - type: custom:powerschool-v4-card
            student: Teagan
            show_empty: true
            grid_options:
              columns: full

  - title: Trent
    path: trent
    icon: mdi:account
    type: panel
    cards:
      - type: custom:powerschool-v4-card
        student: Trent

  - title: Teagan
    path: teagan
    icon: mdi:account-outline
    type: panel
    cards:
      - type: custom:powerschool-v4-card
        student: Teagan
        show_empty: true
