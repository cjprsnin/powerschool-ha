blueprint:
  name: PowerSchool due tomorrow (legacy path)
  description: >
    Prefer powerschool_due_tomorrow.yaml. This file remains for older
    installs; default time is 17:00 and filters days_until_due == 1.
  domain: automation
  input:
    upcoming_sensor:
      name: Upcoming assignments sensor
      selector:
        entity:
          integration: powerschool
          domain: sensor
    notify_device:
      name: Notify service (e.g. notify.mobile_app_phone)
      selector:
        text:
    time:
      name: Time to check
      default: "17:00:00"
      selector:
        time:

trigger:
  - platform: time
    at: !input time

condition:
  - condition: template
    value_template: >
      {% set items = state_attr(upcoming_sensor, 'assignments') or [] %}
      {% set soon = items | selectattr('days_until_due', 'equalto', 1) | list %}
      {{ soon | count > 0 }}

action:
  - variables:
      upcoming_sensor: !input upcoming_sensor
      items: "{{ state_attr(upcoming_sensor, 'assignments') or [] }}"
      soon: "{{ items | selectattr('days_until_due', 'equalto', 1) | list }}"
  - service: !input notify_device
    data:
      title: PowerSchool — due tomorrow
      message: >
        {% for a in soon %}
        • {{ a.name }} ({{ a.course }})
        {% endfor %}
mode: single
