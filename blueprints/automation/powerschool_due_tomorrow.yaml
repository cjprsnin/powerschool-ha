blueprint:
  name: PowerSchool due tomorrow
  description: >
    Afternoon digest of ungraded assignments due tomorrow, from the
    upcoming-assignments sensor. Default 17:00 (after school).
  domain: automation
  source_url: https://github.com/cjprsnin/powerschool-ha/blob/main/blueprints/automation/powerschool_due_tomorrow.yaml
  input:
    upcoming_sensor:
      name: Upcoming assignments sensor
      description: sensor.*_upcoming_count (or Upcoming Assignments)
      selector:
        entity:
          integration: powerschool
          domain: sensor
    notify_service:
      name: Notify service
      description: "Full service id, e.g. notify.mobile_app_iphone"
      selector:
        text:
    time:
      name: Time to check
      default: "17:00:00"
      selector:
        time:

variables:
  upcoming_sensor: !input upcoming_sensor
  notify_service: !input notify_service

trigger:
  - platform: time
    at: !input time

condition:
  - condition: template
    value_template: >
      {% set items = state_attr(upcoming_sensor, 'assignments') or [] %}
      {% set soon = items | selectattr('days_until_due', 'equalto', 1) | list %}
      {{ soon | count > 0 }}

action:
  - variables:
      items: "{{ state_attr(upcoming_sensor, 'assignments') or [] }}"
      soon: "{{ items | selectattr('days_until_due', 'equalto', 1) | list }}"
      student: >
        {{ state_attr(upcoming_sensor, 'student')
           or (state_attr(upcoming_sensor, 'friendly_name') or 'Student') }}
  - service: "{{ notify_service }}"
    data:
      title: "Due tomorrow — {{ student }}"
      message: >
        {{ soon | count }} assignment{{ 's' if soon | count != 1 else '' }} due tomorrow.
        {% for a in soon %}
        • {{ a.name }}{% if a.course %} ({{ a.course }}){% endif %}
        {% endfor %}
mode: single
