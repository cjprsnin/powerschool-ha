blueprint:
  name: PowerSchool missing / late work alert
  description: >
    Notify when a student's missing or late assignment count increases.
    Message includes both current totals. Optional quiet hours (default
    22:00–07:00).
  domain: automation
  source_url: https://github.com/cjprsnin/powerschool-ha/blob/main/blueprints/automation/powerschool_missing_work.yaml
  input:
    missing_sensor:
      name: Missing assignments sensor
      description: sensor.*_missing (or Missing Assignments)
      selector:
        entity:
          integration: powerschool
          domain: sensor
    late_sensor:
      name: Late assignments sensor
      description: sensor.*_late (or Late Assignments)
      selector:
        entity:
          integration: powerschool
          domain: sensor
    notify_service:
      name: Notify service
      description: "Full service id, e.g. notify.mobile_app_iphone"
      selector:
        text:
    quiet_start:
      name: Quiet hours start
      default: "22:00:00"
      selector:
        time:
    quiet_end:
      name: Quiet hours end
      default: "07:00:00"
      selector:
        time:

variables:
  missing_sensor: !input missing_sensor
  late_sensor: !input late_sensor
  notify_service: !input notify_service

trigger:
  - platform: state
    entity_id: !input missing_sensor
    id: missing
  - platform: state
    entity_id: !input late_sensor
    id: late

condition:
  - condition: template
    value_template: >
      {% set n = states(trigger.entity_id) | int(0) %}
      {% set prev = trigger.from_state.state | int(0) if trigger.from_state else 0 %}
      {{ n > prev }}
  - condition: not
    conditions:
      - condition: time
        after: !input quiet_start
        before: !input quiet_end

action:
  - variables:
      kind: "{{ trigger.id }}"
      student: >
        {{ state_attr(trigger.entity_id, 'student')
           or (state_attr(trigger.entity_id, 'friendly_name') or 'Student') }}
      missing_n: "{{ states(missing_sensor) | int(0) }}"
      late_n: "{{ states(late_sensor) | int(0) }}"
      prev: "{{ trigger.from_state.state if trigger.from_state else '?' }}"
  - service: "{{ notify_service }}"
    data:
      title: "{{ student }} — {{ kind }} work"
      message: >
        {{ kind | title }} count is now {{ states(trigger.entity_id) }} (was {{ prev }}).
        Totals: {{ missing_n }} missing, {{ late_n }} late.
mode: queued
max_exceeded: silent
