blueprint:
  name: PowerSchool missing / late work alert
  description: >
    Notify when a student's missing or late assignment count increases.
    Optional quiet hours skip overnight alerts.
  domain: automation
  input:
    missing_sensor:
      name: Missing assignments sensor
      selector:
        entity:
          integration: powerschool
          domain: sensor
    late_sensor:
      name: Late assignments sensor
      selector:
        entity:
          integration: powerschool
          domain: sensor
    notify_device:
      name: Notify service (e.g. notify.mobile_app_phone)
      selector:
        text:
    quiet_start:
      name: Quiet hours start (optional)
      default: "22:00:00"
      selector:
        time:
    quiet_end:
      name: Quiet hours end (optional)
      default: "07:00:00"
      selector:
        time:

trigger:
  - platform: state
    entity_id: !input missing_sensor
  - platform: state
    entity_id: !input late_sensor

condition:
  - condition: template
    value_template: >
      {% set n = states(trigger.entity_id) | int(0) %}
      {% set prev = trigger.from_state.state | int(0) if trigger.from_state else 0 %}
      {{ n > prev }}
  - condition: not
    conditions:
      - condition: time
        after: !input quiet_start
        before: !input quiet_end

action:
  - variables:
      kind: >
        {{ 'missing' if 'missing' in trigger.entity_id else 'late' }}
      student: >
        {{ state_attr(trigger.entity_id, 'student')
           or (state_attr(trigger.entity_id, 'friendly_name') or '')
                | replace('PowerSchool ', '')
                | replace(' Missing Assignments', '')
                | replace(' Late Assignments', '') }}
  - service: !input notify_device
    data:
      title: "PowerSchool — {{ student }}"
      message: >
        {{ student }}: {{ states(trigger.entity_id) }} {{ kind }}
        (was {{ trigger.from_state.state if trigger.from_state else '?' }}).
mode: single
